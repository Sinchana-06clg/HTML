<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Google Maps with Directions</title>
    <style>
        /* Full-screen map */
        #map {
            height: 100vh;
            width: 100%;
        }
        /* Input panel styling */
        #panel {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 5;
        }
        input {
            padding: 5px;
            margin: 5px;
            width: 200px;
        }
        button {
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <!-- Input panel -->
    <div id="panel">
        <input id="start" type="text" placeholder="Start location" value="Bangalore, India">
        <input id="end" type="text" placeholder="End location" value="Mysore, India">
        <button onclick="calculateRoute()">Get Directions</button>
    </div>

    <!-- Map container -->
    <div id="map"></div>

    <script>
        let map, directionsService, directionsRenderer;

        function initMap() {
            // Initialize map centered in India
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 7,
                center: { lat: 12.9716, lng: 77.5946 } // Bangalore
            });

            // Initialize directions services
            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer();
            directionsRenderer.setMap(map);
        }

        function calculateRoute() {
            const start = document.getElementById("start").value.trim();
            const end = document.getElementById("end").value.trim();

            if (!start || !end) {
                alert("Please enter both start and end locations.");
                return;
            }

            directionsService.route(
                {
                    origin: start,
                    destination: end,
                    travelMode: google.maps.TravelMode.DRIVING
                },
                (response, status) => {
                    if (status === "OK") {
                        directionsRenderer.setDirections(response);
                    } else {
                        alert("Directions request failed: " + status);
                    }
                }
            );
        }
    </script>

    <!-- Load Google Maps JavaScript API -->
    <script async
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
    </script>
</body>
</html>
