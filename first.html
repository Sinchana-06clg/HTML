<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- Supports all characters -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Mobile-friendly -->
    <meta name="description" content="A basic HTML example page">
    <title>My First Webpage</title>
    <style>
        /* Simple CSS styling */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #2c3e50;
        }
        p {
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Webpage</h1>
    <p>This is a basic HTML page with a heading, paragraph, and an image.</p>
    
    <!-- Example image -->
    <img src="https://via.placeholder.com/300" alt="Sample Image" width="300">

    <!-- Example link -->
    <p>Visit <a href="https://www.example.com" target="_blank">Example.com</a> for more info.</p>
</body>
</html>
